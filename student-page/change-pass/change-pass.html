<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - OJT-LOGS</title>

    <link rel="stylesheet" href="/templated/header.css">
    <link rel="stylesheet" href="/templated/sidebar.css">
    <link rel="stylesheet" href="change-pass.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>

<body>

<div class="dashboard">
    <div id="sidebar-container"></div>

    <main class="main">
        <header id="header-container"></header>

        <div class="profile-container">
            <div class="profile-card">
                <div class="card-title security-title">
                    <span class="vertical-line red"></span>
                    <h2>Change Password</h2>
                </div>

                <div id="alertMessage" class="alert-banner" style="display: none;"></div>

                <form id="changePasswordForm">
                    
                    <div class="form-group">
                        <div class="input-box">
                            <input id="currentPassword" type="password" placeholder=" " required>
                            <label for="currentPassword">Current Password</label>
                            <i class="fa-regular fa-eye toggle-password"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="input-box">
                            <input id="newPassword" type="password" placeholder=" " required>
                            <label for="newPassword">New Password</label>
                            <i class="fa-regular fa-eye toggle-password"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="input-box">
                            <input id="confirmPassword" type="password" placeholder=" " required>
                            <label for="confirmPassword">Confirm New Password</label>
                            <i class="fa-regular fa-eye toggle-password"></i>
                        </div>
                    </div>

                    <div class="password-rules">
                        <p>Password must contain:</p>
                        <ul>
                            <li>At least 8 characters</li>
                            <li>At least 1 uppercase letter</li>
                            <li>At least 1 number</li>
                        </ul>
                    </div>

                    <div class="button-group">
                        <button type="button" class="cancel-btn" id="cancelBtn">Cancel</button>
                        <button type="submit" class="continue-btn" id="savePasswordBtn">Update Password</button>
                    </div>

                </form>
            </div>
        </div>
    </main>
</div>

<script src="/templated/header-loader.js"></script>
<script src="/templated/sidebar-loader.js"></script>
<script type="module" src="change-pass.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        if (typeof loadHeader === "function") loadHeader("Change Password");
        if (typeof loadSidebar === "function") loadSidebar("Settings");
    });
</script>

</body>
</html>
