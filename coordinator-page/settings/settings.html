<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings | OJT-LOGS</title>

    <!-- Shared Layout -->
    <link rel="stylesheet" href="../sidebar/sidebar-web.css">
    <!-- Page CSS -->
    <link rel="stylesheet" href="settings.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

</head>

<body>

<div class="dashboard">

<!-- ===================== SIDEBAR ===================== -->

<div id="sidebar-container"></div>

<!-- ===================== MAIN CONTENT ===================== -->

<main class="main">

<header>

    <div>
        <h2>Settings</h2>
        <p>Manage your profile information and account security.</p>
    </div>

    <div class="top-right">

        <div class="notification">

            <i class="fa-regular fa-bell"></i>
            <span class="badge">3</span>

        </div>

        <div class="profile">

            <div class="avatar" id="profileAvatar">
                JD
            </div>

            <div class="profile-info">

                <h4 id="profileName">
                    John Doe
                </h4>

                <p>OJT Coordinator</p>

            </div>

            <i class="fa-solid fa-chevron-down"></i>

        </div>

    </div>

</header>

<!-- ===================== SETTINGS ===================== -->

<section class="settings-page">

    <!-- PROFILE CARD -->

    <div class="settings-card">

        <div class="card-header">

            <div>

                <h3>
                    <i class="fa-solid fa-user"></i>
                    Profile Information
                </h3>

                <p>Update your personal information.</p>

            </div>

        </div>

        <div class="profile-section">

            <!-- PHOTO -->

            <div class="profile-photo">

                <img src="../images/profile.png"
                    id="previewImage"
                    alt="Profile">

                <label class="upload-btn">

                    <input
                        type="file"
                        id="imageUpload"
                        accept="image/*"
                        hidden>

                    <i class="fa-solid fa-camera"></i>

                    Change Photo

                </label>

            </div>

            <!-- FORM -->

            <div class="profile-form">

                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        value="John Doe">

                </div>

                <div class="form-group">

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        value="coordinator@grc.edu.ph">

                </div>

                <div class="form-row">

                    <div class="form-group">

                        <label>
                            Phone Number
                        </label>

                        <input
                            type="text"
                            id="phone"
                            value="+63 912 345 6789">

                    </div>

                    <div class="form-group">

                        <label>
                            Position
                        </label>

                        <input
                            type="text"
                            value="OJT Coordinator"
                            readonly>

                    </div>

                </div>
                                <div class="form-actions">

                    <button type="button" class="btn btn-secondary" id="cancelProfile">
                        <i class="fa-solid fa-rotate-left"></i>
                        Cancel
                    </button>

                    <button type="button" class="btn btn-primary" id="saveProfile">
                        <i class="fa-solid fa-floppy-disk"></i>
                        Save Changes
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- CHANGE PASSWORD -->

    <div class="settings-card">

        <div class="card-header">

            <div>

                <h3>
                    <i class="fa-solid fa-key"></i>
                    Change Password
                </h3>

                <p>Keep your account secure by using a strong password.</p>

            </div>

        </div>

        <div class="password-form">

            <div class="form-group">

                <label>Current Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="currentPassword"
                        placeholder="Enter current password">

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="currentPassword">

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

            </div>

            <div class="form-group">

                <label>New Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password">

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="newPassword">

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

                <div class="password-strength">

                    <div class="strength-bar">

                        <div class="strength-fill" id="strengthFill"></div>

                    </div>

                    <small id="strengthText">
                        Password Strength
                    </small>

                </div>

            </div>

            <div class="form-group">

                <label>Confirm Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password">

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="confirmPassword">

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

                <small id="passwordMatch"></small>

            </div>

            <div class="form-actions">

                <button
                    type="button"
                    class="btn btn-primary"
                    id="updatePassword">

                    <i class="fa-solid fa-shield-halved"></i>

                    Update Password

                </button>

            </div>

        </div>

    </div>

</section>

</main>

</div>

<!-- SUCCESS TOAST -->

<div class="toast" id="toast">

    <i class="fa-solid fa-circle-check"></i>

    <span id="toastMessage">
        Changes saved successfully.
    </span>

</div>

<script src="../sidebar/sidebar-web.js"></script>
<script src="settings.js"></script>

</body>
</html>
