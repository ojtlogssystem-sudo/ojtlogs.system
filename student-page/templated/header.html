<div class="header-left">
    <button id="mobile-menu">
        <i class="fa-solid fa-bars"></i>
    </button>

    <h2 id="page-title"></h2>
</div>

<div class="top-right">
    <div class="notification" id="notification-btn">
        <i class="fa-regular fa-bell"></i>
        <span class="notification-badge" id="notification-badge" style="display:none;">0</span>

        <div class="notification-panel" id="notification-panel">
            <div class="notification-panel-header">
                <h4>Notifications</h4>
                <button type="button" class="notification-clear-all" id="notification-clear-all">Clear all</button>
            </div>
            <div class="notification-list" id="notification-list">
                <div class="notif-empty">Loading...</div>
            </div>
        </div>
    </div>

    <div class="ai-suggestion" id="ai-completion-pill" style="display:none;">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span id="ai-completion-text">Estimating completion date…</span>

        <div class="ai-suggestion-panel" id="ai-completion-panel">
            <div class="ai-suggestion-panel-header">
                <h4>OJT Completion Estimate</h4>
            </div>
            <div class="ai-suggestion-panel-body" id="ai-completion-panel-body">
                <p class="ai-suggestion-empty">Log more hours to get an estimate.</p>
            </div>
        </div>
    </div>

    <div class="profile" id="profile-btn">
        <div class="avatar" id="user-avatar">--</div>
        <i class="fa-solid fa-chevron-down"></i>

        <div class="profile-card-dropdown" id="profile-dropdown-menu">
            <div class="profile-card-header">
                <h4 id="dropdown-user-fullname">Loading...</h4>
                <p class="role-title">Student Intern</p>
            </div>

            <div class="profile-card-body">
                <a href="/profile/profile.html" class="profile-menu-item">
                    <i class="fa-regular fa-user"></i>
                    <span>My Profile</span>
                </a>
                <a href="/settings/settings.html" class="profile-menu-item">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </a>
                <a href="#" id="logout-btn" class="profile-menu-item logout">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>Logout</span>
                </a>
            </div>
        </div>
    </div>
</div>
