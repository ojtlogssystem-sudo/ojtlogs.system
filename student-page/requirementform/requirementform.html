<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requirement Form</title>
    <link rel="stylesheet" href="requirementform.css">
</head>
<body>

    <!-- TOOLBAR (hidden on print): Back / Print + form switcher -->
    <div class="no-print req-toolbar">
        <div class="toolbar-actions">
            <button type="button" id="btn-back-form" class="tb-btn tb-ghost">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
                <span>Back</span>
            </button>

            <button type="button" id="btn-download" class="tb-btn tb-primary">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
                <span id="download-label">Download</span>
            </button>

            <button type="button" class="tb-btn tb-ghost" onclick="window.print()">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                <span>Print</span>
            </button>
        </div>

        <!-- Nilalagay ng JS ang mga button ng bawat form -->
        <div class="form-switch" id="form-switch"></div>
    </div>

    <!-- Dito nire-render ang napiling form -->
    <div class="sheet-wrapper">
        <div id="form-sheet" class="sheet">
            <p class="sheet-status">Loading form...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js"></script>
    <script type="module" src="requirementform.js"></script>
</body>
</html>
