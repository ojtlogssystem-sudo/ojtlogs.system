<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - OJT-LOGS</title>

    <link rel="stylesheet" href="../templated/header.css">
    <link rel="stylesheet" href="../templated/sidebar.css">
    <link rel="stylesheet" href="change-pass.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>

<body>

<div class="dashboard">
    <div id="sidebar-container"></div>

    <main class="main">
        <header id="header-container"></header>

        <div class="profile-container">
            <div class="profile-card">
                <div class="card-title security-title">
                    <span class="vertical-line red"></span>
                    <h2>Change Password</h2>
                </div>

                <div id="alertMessage" class="alert-banner" style="display: none;"></div>

                <form id="changePasswordForm">
                    
                    <div class="form-group">
                        <div class="input-box">
                            <input id="currentPassword" type="password" placeholder=" " required>
                            <label for="currentPassword">Current Password</label>
                            <i class="fa-regular fa-eye toggle-password"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="input-box">
                            <input id="newPassword" type="password" placeholder=" " required>
                            <label for="newPassword">New Password</label>
                            <i class="fa-regular fa-eye toggle-password"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="input-box">
                            <input id="confirmPassword" type="password" placeholder=" " required>
                            <label for="confirmPassword">Confirm New Password</label>
                            <i class="fa-regular fa-eye toggle-password"></i>
                        </div>
                    </div>

                    <div class="password-rules">
                        <p>Password must contain:</p>
                        <ul>
                            <li>At least 8 characters</li>
                            <li>At least 1 uppercase letter</li>
                            <li>At least 1 number</li>
                        </ul>
                    </div>

                    <div class="button-group">
                        <button type="button" class="cancel-btn" id="cancelBtn">Cancel</button>
                        <button type="submit" class="continue-btn" id="savePasswordBtn">Update Password</button>
                    </div>

                </form>
            </div>
        </div>
    </main>
</div>

<!-- SUCCESS POPUP (lalabas pagkatapos ma-update ang password) -->
<div class="success-modal-overlay" id="successModalOverlay">
    <div class="success-modal">
        <div class="success-modal-icon">
            <i class="fa-solid fa-check"></i>
        </div>
        <h3>Password Updated</h3>
        <p>Your password has been changed successfully.</p>
    </div>
</div>

<!-- sidebar-loader.js is a classic (non-module) script — defines loadSidebar globally -->
<script src="../templated/sidebar-loader.js"></script>
<!-- change-pass.js is a module: it imports loadHeader directly and also
     handles the DOMContentLoaded wiring for both header and sidebar -->
<script type="module" src="change-pass.js"></script>

</body>
</html>
